:root{--bg:#0a0c11;--s1:#12151c;--s2:#1a1e28;--line:#262b38;--tx:#eef1f6;--mu:#9aa3b5;--cu:#e5303a;--cu2:#f0562f;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:400 1rem/1.5 "Barlow",system-ui,sans-serif;scrollbar-color:#2c3242 var(--bg)}
::selection{background:var(--cu);color:#120d08}:focus-visible{outline:2px solid var(--cu2);outline-offset:3px;border-radius:6px}
.wrap{width:min(1180px,100% - 2rem);margin-inline:auto;padding-bottom:4rem}
.top{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 0;border-bottom:1px solid var(--line);margin-bottom:2rem;gap:1rem;flex-wrap:wrap}
h1,h2{font-family:"Bebas Neue","Arial Narrow",Impact,sans-serif;letter-spacing:-.02em;line-height:1.1}h1{font-size:2.4rem}h1 i{color:var(--cu);font-weight:500}h2{font-size:2rem;margin:2.4rem 0 1rem}
.btn{font:500 .9rem "Barlow",sans-serif;padding:.6rem 1.1rem;border-radius:999px;border:1px solid var(--line);background:none;color:var(--tx);cursor:pointer;text-decoration:none;transition:transform .2s var(--ease),border-color .2s,background .2s}
.btn:hover{border-color:var(--cu);transform:translateY(-2px)}.btn:active{transform:scale(.97)}.btn.p{background:var(--cu);border-color:var(--cu);color:#ffffff}.btn.p:hover{background:var(--cu2)}.btn.d:hover{border-color:#c0604f;color:#e0948a}
.mt{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem}
.m{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:1.2rem;transition:transform .3s var(--ease),border-color .3s}.m:hover{transform:translateY(-3px);border-color:#5a2e30}
.m span{color:var(--mu);font-size:.9rem}.m b{display:block;font:700 2rem "Barlow",sans-serif;font-variant-numeric:tabular-nums;margin-top:.2rem}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--s1)}table{width:100%;border-collapse:collapse;min-width:640px;font-variant-numeric:tabular-nums}
th,td{padding:.8rem 1rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--mu);font-weight:500;font-size:.85rem}tr:last-child td{border:0}tbody tr{transition:background .2s}tbody tr:hover{background:var(--s2)}
td img{width:44px;height:44px;border-radius:8px;object-fit:cover;display:block;background:var(--s2)}td .btn{padding:.35rem .8rem;margin-right:.3rem}
.tag{font-size:.82rem;padding:.2rem .6rem;border-radius:99px;border:1px solid var(--line);color:var(--mu)}.tag.o{color:#9bd3a4;border-color:#3a5a41}.tag.x{color:#e0948a;border-color:#6a3a34}
.empty{color:var(--mu);padding:1.4rem}.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.bar h2{margin:2.4rem 0 1rem}
dialog{margin:auto;width:min(460px,100% - 2rem);background:var(--s1);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:1.6rem}dialog::backdrop{background:rgba(0,0,0,.65)}
dialog form{display:grid;gap:.9rem}label{display:grid;gap:.3rem;font-size:.9rem;color:var(--mu)}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.65rem .75rem;width:100%}input:focus,select:focus{border-color:var(--cu);outline:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}#pv{width:100%;max-height:150px;object-fit:cover;border-radius:8px;display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="mt" id="mt"></div>

<div class="bar"><h2>Productos</h2><button class="btn p" id="new">Nuevo producto</button></div>
<div class="tw"><table><thead><tr><th></th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr></thead><tbody id="pb"></tbody></table></div>

<div class="bar"><h2>Pedidos recientes</h2><button class="btn d" id="rst">Reiniciar pedidos y registros</button></div>
<div class="tw"><table><thead><tr><th>Pedido</th><th>Fecha</th><th>Cliente</th><th>Ciudad</th><th>Artículos</th><th>Total</th></tr></thead><tbody id="ob"></tbody></table></div>

<h2>Más agregados al carrito</h2>
<div class="tw"><table><thead><tr><th>Producto</th><th>Veces agregado</th></tr></thead><tbody id="eb"></tbody></table></div>
</div>

<dialog id="dg"><form id="pf" method="dialog"><h2 id="dt" style="margin:0">Producto</h2>
<label>Nombre<input id="fn" required maxlength="80"></label>
<div class="two"><label>Precio (USD)<input id="fp" type="number" min="0" step="0.01" required></label><label>Stock<input id="fs" type="number" min="0" step="1" required></label></div>
<label>Categoría<input id="fc" list="cats" required maxlength="30"></label><datalist id="cats"></datalist>
<label style="display:flex;flex-direction:row;align-items:center;gap:.6rem"><input id="fd" type="checkbox" style="width:auto">Destacado en el carrusel</label><label>Imagen (URL)<input id="fi" type="url" placeholder="https://..."></label>
<label>O sube una imagen<input id="ff" type="file" accept="image/*"></label><img id="pv" alt="Vista previa">
<div style="display:flex;gap:.6rem;justify-content:flex-end"><button class="btn" type="button" id="cc">Cancelar</button><button class="btn p" type="submit">Guardar</button></div></form></dialog>

<script>
try{if(sessionStorage.getItem('sb_auth')!=='1')location.replace('login.html')}catch{location.replace('login.html')}
const K={p:'sb_products',c:'sb_cart',o:'sb_orders',e:'sb_events'};
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{alert('No se pudo guardar: almacenamiento lleno. Usa una imagen más pequeña.');return false}};
const $=s=>document.querySelector(s),money=n=>'$'+Number(n).toFixed(2);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ph=n=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="#1a1e28"/><text x="200" y="168" text-anchor="middle" font-family="Georgia,serif" font-size="52" fill="#d09255">${esc(n.trim().slice(0,2).toUpperCase())}</text></svg>`);
let editId=null,imgData='';
function render(){const ps=ld(K.p,[]),os=ld(K.o,[]),es=ld(K.e,[]);
const av=ps.filter(p=>p.stock>0).length,sales=os.reduce((a,o)=>a+o.total,0);
$('#mt').innerHTML=[['Agregados al carrito',es.length],['Pedidos',os.length],['Ventas',money(sales)],['Disponibles',av+' de '+ps.length],['Agotados',ps.length-av]].map(x=>`<div class="m"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
$('#pb').innerHTML=ps.map(p=>`<tr><td><img alt="" src="${p.img?esc(p.img):ph(p.name)}" onerror="this.onerror=null;this.src='${ph(p.name)}'"></td><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><span class="tag ${p.stock>0?'o':'x'}">${p.stock>0?'Disponible':'Agotado'}</span></td><td><button class="btn" data-e="${p.id}">Editar</button><button class="btn d" data-x="${p.id}">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sin productos. Abre la tienda una vez para cargar el catálogo de ejemplo, o crea uno nuevo.</td></tr>';
$('#ob').innerHTML=os.slice().reverse().slice(0,20).map(o=>`<tr><td>${esc(o.id)}</td><td>${new Date(o.date).toLocaleString('es-VE')}</td><td>${esc(o.name)}<br><small style="color:var(--mu)">${esc(o.phone)}</small></td><td>${esc(o.city)}</td><td>${o.items.map(i=>i.q+' x '+esc(i.name)).join('<br>')}</td><td>${money(o.total)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Aún no hay pedidos.</td></tr>';
const cnt={};es.forEach(e=>cnt[e.name]=(cnt[e.name]||0)+1);
$('#eb').innerHTML=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">Sin registros todavía.</td></tr>';
$('#cats').innerHTML=[...new Set(ps.map(p=>p.cat))].map(c=>`<option value="${esc(c)}">`).join('')}
function openForm(id){editId=id;imgData='';const p=ld(K.p,[]).find(x=>x.id===id)||{name:'',price:'',stock:'',cat:'',img:'',feat:false};
$('#dt').textContent=id?'Editar producto':'Nuevo producto';fn.value=p.name;fp.value=p.price;fs.value=p.stock;fc.value=p.cat;fd.checked=!!p.feat;fi.value=p.img&&!p.img.startsWith('data:')?p.img:'';ff.value='';
pv.style.display=p.img?'block':'none';pv.src=p.img||'';if(p.img&&p.img.startsWith('data:'))imgData=p.img;$('#dg').showModal();fn.focus()}
$('#new').onclick=()=>openForm(null);$('#cc').onclick=()=>$('#dg').close();
ff.onchange=()=>{const f=ff.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,600/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);imgData=c.toDataURL('image/jpeg',.8);pv.src=imgData;pv.style.display='block';fi.value=''};im.src=r.result};r.readAsDataURL(f)};
$('#pf').onsubmit=()=>{const ps=ld(K.p,[]);const img=imgData||fi.value.trim();
const d={name:fn.value.trim(),price:+fp.value,stock:Math.max(0,Math.floor(+fs.value)),cat:fc.value.trim(),img,feat:fd.checked};
if(editId){Object.assign(ps.find(x=>x.id===editId),d)}else ps.push({id:'p'+Date.now().toString(36),...d});
if(sv(K.p,ps))render()};
document.addEventListener('click',e=>{const t=e.target.closest('[data-e],[data-x]');if(!t)return;
if(t.dataset.e)openForm(t.dataset.e);
if(t.dataset.x&&confirm('¿Eliminar este producto? No se puede deshacer.')){const id=t.dataset.x;sv(K.p,ld(K.p,[]).filter(p=>p.id!==id));sv(K.c,ld(K.c,[]).filter(i=>i.id!==id));render()}});
$('#rst').onclick=()=>{if(confirm('¿Borrar todos los pedidos y registros del carrito? No se puede deshacer.')){sv(K.o,[]);sv(K.e,[]);render()}};
$('#out').onclick=()=>{try{sessionStorage.removeItem('sb_auth')}catch{}location.href='login.html'};
render();
</script></body></html>
